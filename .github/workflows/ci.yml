name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO & menu prerendering
        run: npm run seo:prerender

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run static security and asset checks
        run: node scripts/static-checks.js

      - name: Validate Schema.org JSON-LD markup
        run: npm run seo:validate

      - name: Run unit, security & API integration tests
        run: npm run test:unit

      - name: Production Vite build
        run: npm run build
