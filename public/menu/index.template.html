<!DOCTYPE html>
<html lang="en-IN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Questrial:wght@400&display=swap"
    rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Questrial:wght@400&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap');

    :root {
      --color-cream-bg: #FAF4EC;
      --color-cream-card: #FAF4EC;
      --color-accent-orange: #C04A0C;
      --color-accent-orange-hover: #A33C08;
      --color-text-dark: #2B170B;
      --color-text-muted: #6B5545;
      --color-border: #E8DACB;
      --color-footer-bar: #351C12;
      --font-heading: 'Questrial', sans-serif;
      --font-serif: 'Questrial', sans-serif;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-pill: 9999px;
      --radius-lg: 20px;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--color-cream-bg);
      background-image: radial-gradient(rgba(107, 85, 69, 0.045) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--color-text-dark);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 12px 0 80px 0;
    }

    button,
    input {
      font-family: inherit;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      color: var(--color-text-dark);
    }

    p, span, li, a, label, input, textarea, select, small,
    .dish-card-desc,
    .modal-dish-desc,
    .category-group-badge,
    .search-input {
      font-family: var(--font-sans);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .menu-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* TOP BAR ACTIONS */
    .menu-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .menu-top-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 20px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-review-us {
      background-color: var(--color-text-dark);
      color: #FAF4EC;
      border: 1px solid var(--color-text-dark);
      box-shadow: 0 2px 8px rgba(43, 23, 11, 0.15);
    }

    .btn-review-us:hover {
      background-color: var(--color-accent-orange);
      border-color: var(--color-accent-orange);
      color: #ffffff;
    }

    .btn-back-website {
      background-color: var(--color-cream-card);
      color: var(--color-text-dark);
      border: 1.5px solid var(--color-border);
      box-shadow: 0 1px 4px rgba(43, 23, 11, 0.04);
    }

    .btn-back-website:hover {
      background-color: #F1E3D3;
      border-color: var(--color-text-dark);
      color: var(--color-text-dark);
    }

    /* HERO VIDEO SECTION (1/2 Screen Height, Full Visibility, Top Buttons & Categories Visible) */
    .menu-hero-video-section {
      width: 100%;
      margin-bottom: 14px;
    }

    .hero-video-wrapper {
      position: relative;
      width: 100%;
      height: 50vh;
      min-height: 300px;
      max-height: 540px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background-color: #1a0d06;
      box-shadow: 0 4px 18px rgba(43, 23, 11, 0.08);
      border: 1px solid rgba(232, 218, 203, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-video-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Sticky Category & Search Navigation Bar */
    .menu-sticky-control-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-cream-bg);
      padding: 8px 0 14px 0;
      margin: 0 0 18px 0;
      border-bottom: 1px solid rgba(232, 218, 203, 0.85);
    }

    .menu-category-nav {
      margin-bottom: 12px;
      overflow-x: auto;
      padding: 2px 2px 4px 2px;
      scrollbar-width: none;
    }

    .menu-category-nav::-webkit-scrollbar {
      display: none;
    }

    .category-tabs-track {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .category-tab-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* Card-style Category Button */
    .category-tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      height: 74px;
      padding: 10px 12px;
      border-radius: 16px;
      background-color: var(--color-cream-card);
      border: 1.5px solid var(--color-border);
      color: var(--color-text-dark);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(43, 23, 11, 0.04);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      user-select: none;
    }

    .category-tab-btn:hover {
      background-color: #F8EFE4;
      border-color: var(--color-accent-orange);
    }

    .category-tab-btn.active {
      background-color: var(--color-text-dark);
      border-color: var(--color-text-dark);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(43, 23, 11, 0.16);
    }

    .category-icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
    }

    .tab-label {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .tab-active-indicator {
      width: 34px;
      height: 3px;
      background-color: var(--color-accent-orange);
      border-radius: 2px;
    }

    /* SEARCH BAR & ITEM COUNT */
    .menu-search-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      max-width: 520px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 44px;
      background-color: #FFFFFF;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      color: var(--color-text-dark);
      box-shadow: 0 1px 4px rgba(43, 23, 11, 0.03);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-accent-orange);
      box-shadow: 0 0 0 3px rgba(192, 74, 12, 0.12);
    }

    .search-clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: var(--color-border);
      color: var(--color-text-dark);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-results-count {
      font-size: 14px;
      color: var(--color-text-muted);
      white-space: nowrap;
      font-family: var(--font-sans);
    }

    .menu-results-count strong {
      color: var(--color-text-dark);
      font-size: 15px;
      font-weight: 700;
    }

    /* CATEGORY GROUP SECTIONS */
    .dishes-container {
      width: 100%;
    }

    .category-group-block {
      margin-bottom: 36px;
    }

    .category-group-block:last-child {
      margin-bottom: 16px;
    }

    .category-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(232, 218, 203, 0.7);
    }

    .category-group-heading,
    .category-group-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-dark);
      letter-spacing: 0.01em;
      margin: 0;
    }

    .category-group-badge {
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      background-color: rgba(43, 23, 11, 0.06);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    /* DISH CARDS GRID (4 Columns on Desktop) */
    .dishes-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .menu-dish-card {
      background-color: var(--color-cream-card);
      border-radius: 14px;
      border: 1px solid rgba(43, 23, 11, 0.08);
      padding: 12px;
      box-shadow: 0 1px 3px rgba(43, 23, 11, 0.03), 0 4px 10px rgba(43, 23, 11, 0.02);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .menu-dish-card:hover {
      border-color: rgba(192, 74, 12, 0.35);
      box-shadow: 0 2px 8px rgba(43, 23, 11, 0.06);
    }

    .menu-dish-card:active {
      background-color: #F5EAE0;
    }

    .dish-card-image-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      overflow: hidden;
      background-color: #F8EFE4;
      border: 1px solid rgba(232, 218, 203, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .dish-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dish-tag-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: #E8F5E9;
      color: #2E7D32;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(46, 125, 50, 0.2);
      z-index: 2;
      box-shadow: 0 1px 4px rgba(43, 23, 11, 0.08);
    }

    .dish-card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 2px 0 2px;
    }

    .dish-card-title {
      font-family: var(--font-heading);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin: 0;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }

    .dish-orange-bar {
      display: none !important;
    }

    .dish-card-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-accent-orange);
      letter-spacing: -0.01em;
      margin-top: auto;
    }

    /* DISH DETAIL MODAL */
    .dish-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(43, 23, 11, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dish-modal-backdrop.open {
      display: flex;
    }

    .dish-modal-container {
      position: relative;
      width: 100%;
      max-width: 820px;
      max-height: calc(100vh - 40px);
      background-color: var(--color-cream-card);
      border-radius: 20px;
      border: 1px solid var(--color-border);
      box-shadow: 0 12px 36px rgba(43, 23, 11, 0.16);
      overflow-y: auto;
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #FAF4EC;
      border: 1px solid var(--color-border);
      color: var(--color-text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .modal-close-btn:hover {
      background-color: var(--color-accent-orange);
      border-color: var(--color-accent-orange);
      color: #FFFFFF;
    }

    .dish-modal-content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 32px;
      gap: 30px;
      align-items: flex-start;
    }

    .modal-media-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-main-media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1.25 / 1;
      border-radius: 14px;
      overflow: hidden;
      background-color: #F1E3D3;
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-thumbnails-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .modal-thumb-btn {
      aspect-ratio: 1.25 / 1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      background-color: #F1E3D3;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .modal-thumb-btn.active {
      border-color: var(--color-accent-orange);
      box-shadow: 0 0 0 2px rgba(192, 74, 12, 0.25);
    }

    .modal-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-dish-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin: 0 0 4px 0;
      line-height: 1.25;
    }

    .modal-dish-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin-bottom: 8px;
    }

    .modal-orange-bar {
      width: 36px;
      height: 3px;
      background-color: var(--color-accent-orange);
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .modal-dish-description {
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-text-muted);
      margin-bottom: 18px;
    }

    .modal-divider {
      width: 100%;
      height: 1px;
      background-color: var(--color-border);
      margin-bottom: 16px;
    }

    .modal-attributes-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modal-attr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      flex: 1;
    }

    .attr-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: #FAF4EC;
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 1px 4px rgba(43, 23, 11, 0.04);
    }

    .attr-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-text-dark);
    }

    /* ==========================================================================
       UIVERSE.IO MUBASHIR222 CUSTOMIZABLE ACTION BUTTONS
       ========================================================================== */
    .modal-actions-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
    }

    .modal-actions-row:empty {
      display: none !important;
    }

    .uiverse-menu-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 calc(50% - 6px);
      min-width: 140px;
      padding: 10px 16px;
      overflow: hidden;
      letter-spacing: -0.01em;
      color: #FFFFFF !important;
      background-color: var(--btn-base-bg, #1F2937);
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      min-height: 44px;
      user-select: none;
      box-sizing: border-box;
      text-align: center;
    }

    .uiverse-menu-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .uiverse-menu-btn:active {
      transform: translateY(0);
    }

    .uiverse-menu-btn .btn-hover-circle {
      position: absolute;
      width: 0;
      height: 0;
      transition: all 0.5s ease-out;
      background-color: var(--btn-hover-bg, #EA580C);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 1;
    }

    .uiverse-menu-btn:hover .btn-hover-circle {
      width: 260px;
      height: 260px;
    }

    .uiverse-menu-btn .btn-svg-corner-bl {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 100%;
      margin-left: -8px;
      pointer-events: none;
      z-index: 1;
    }

    .uiverse-menu-btn .btn-svg-corner-tr {
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 100%;
      margin-right: -12px;
      pointer-events: none;
      z-index: 1;
    }

    .uiverse-menu-btn .btn-corner-svg {
      width: auto;
      height: 100%;
      display: block;
    }

    .uiverse-menu-btn .btn-inner-gloss {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin-top: -4px;
      border-radius: 8px;
      opacity: 0.28;
      background: linear-gradient(to bottom, transparent, transparent, rgba(229, 231, 235, 0.35));
      pointer-events: none;
      z-index: 1;
    }

    .uiverse-menu-btn .btn-content-label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 100%;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .uiverse-menu-btn .btn-icon-svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: block;
    }

    /* SOLD OUT & BADGES STYLING */
    .menu-dish-card.sold-out {
      opacity: 0.65;
      filter: grayscale(0.45);
    }

    .dish-soldout-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(43, 23, 11, 0.88);
      color: #FAF4EC;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 3;
    }

    .dish-badge-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--color-accent-orange);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 3;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
    }

    .dish-veg-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      border: 1.5px solid #2E7D32;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .dish-veg-symbol-dot {
      width: 6px;
      height: 6px;
      background-color: #2E7D32;
      border-radius: 50%;
    }

    .dish-variants-row {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

      }
      if (name.includes('starter') || name.includes('papad') || name.includes('tikki') || name.includes('kabab')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M7 23 C7 35 15 39 24 39 C33 39 41 35 41 23 Z" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 23 L43 23" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M16 39 L14 42 H34 L32 39" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18 14 C18 10 20 8 20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M24 14 C24 10 26 8 26 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M30 14 C30 10 32 8 32 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
      }
      if (name.includes('soup')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M9 22 C9 34 16 38 24 38 C32 38 39 34 39 22 Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><line x1="6" y1="22" x2="42" y2="22" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M17 14 C17 10 19 8 19 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M24 15 C24 11 26 9 26 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M31 14 C31 10 33 8 33 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
      }
      if (name.includes('noodle')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M10 24 C10 34 16 38 24 38 C32 34 38 24 Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="24" cy="24" rx="14" ry="4" stroke="currentColor" stroke-width="2.4"/><line x1="16" y1="8" x2="30" y2="24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="20" y1="6" x2="34" y2="22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
      }
      if (name.includes('chinese') || name.includes('manchurian') || name.includes('schezwan')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M10 24 C10 35 15 40 24 40 C33 40 38 35 38 24 Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><line x1="7" y1="24" x2="41" y2="24" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><line x1="16" y1="7" x2="28" y2="23" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="20" y1="5" x2="32" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
      }
      if (name.includes('rice') || name.includes('biryani') || name.includes('pulav') || name.includes('khichadi')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M10 24 C10 35 15 40 24 40 C33 40 38 35 38 24 Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="24" cy="24" rx="14" ry="5" stroke="currentColor" stroke-width="2.4"/><path d="M15 22 C18 16 30 16 33 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      }
      if (name.includes('roti') || name.includes('naan') || name.includes('bread') || name.includes('paratha') || name.includes('kulcha') || name.includes('bhakari')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><ellipse cx="24" cy="27" rx="17" ry="11" stroke="currentColor" stroke-width="2.6"/><path d="M11 26 C13 32 35 34 37 26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="19" cy="24" r="1.5" fill="currentColor"/><circle cx="27" cy="22" r="1.5" fill="currentColor"/><circle cx="23" cy="28" r="1.5" fill="currentColor"/><circle cx="31" cy="26" r="1.2" fill="currentColor"/><circle cx="15" cy="27" r="1.2" fill="currentColor"/></svg>`;
      }
      if (name.includes('raita')) {
        return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M12 25 C12 34 17 38 24 38 C31 38 36 34 36 25 Z" stroke="currentColor" stroke-width="2.6"/><ellipse cx="24" cy="25" rx="12" ry="4" stroke="currentColor" stroke-width="2.4"/><circle cx="21" cy="25" r="1.2" fill="currentColor"/><circle cx="27" cy="24" r="1.2" fill="currentColor"/></svg>`;
      }
      return `<svg viewBox="0 0 48 48" width="30" height="30" fill="none"><path d="M10 21 C10 35 15 41 24 41 C33 41 38 35 38 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="24" cy="21" rx="14" ry="4" stroke="currentColor" stroke-width="2.6"/><path d="M10 24 C5 24 5 30 10 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M38 24 C43 24 43 30 38 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M32 9 L23 23" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M20 22 C19 25 24 27 26 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
    }

    let categories = [
      { id: 'All', label: 'All', icon: getCategoryIcon('All') }
    ];

    function renderCategoryTabs() {
      const track = document.getElementById('categoryTrack');
      track.innerHTML = categories.map(c => {
        const isActive = c.id === currentCategory;
        return `
          <div class="category-tab-wrapper">
            <button
              type="button"
              class="category-tab-btn ${isActive ? 'active' : ''}"
              onclick="selectCategory('${c.id}')"
              aria-label="${c.label} category"
              aria-pressed="${isActive}"
            >
              <div class="category-icon-box">
                ${c.icon}
              </div>
              <span class="tab-label">${c.label}</span>
            </button>
            ${isActive ? '<div class="tab-active-indicator"></div>' : ''}
          </div>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderDishes();
    }

    function handleSearch(val) {
      currentSearch = val.toLowerCase().trim();
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.style.display = currentSearch ? 'flex' : 'none';
      }
      renderDishes();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        handleSearch('');
        input.focus();
      }
    }

    let activeDishSelectedVariant = null;

    function renderDishCard(d) {
      const isSoldOut = d.is_available === 0 || d.is_available === false;
      const cardClasses = `menu-dish-card ${isSoldOut ? 'sold-out' : ''}`;
      const imgUrl = (d.images && d.images.length > 0 && d.images[0]) ? d.images[0] : '/images/dish-placeholder.svg';

      // Determine badge
      let badgeHtml = '';
      if (Array.isArray(d.badges) && d.badges.length > 0) {
        badgeHtml = `<span class="dish-badge-pill">${d.badges[0]}</span>`;
      } else if (d.tag) {
        badgeHtml = `<span class="dish-badge-pill">${d.tag}</span>`;
      }

      // Determine price string
      let priceStr = `₹ ${d.price}`;
      if (d.variants && d.variants.length > 0) {
        const lowest = Math.min(...d.variants.map(v => v.price));
        priceStr = `From ₹ ${lowest}`;
      }

      const isJain = Array.isArray(d.tags) && d.tags.includes('jain');

      return `
        <div class="${cardClasses}" onclick="openDish('${d.id}')">
          <div class="dish-card-image-box">
            <img src="${imgUrl}" alt="${d.name}" class="dish-card-img" loading="lazy" onerror="this.src='/images/dish-placeholder.svg'">
            ${badgeHtml}
            ${isSoldOut ? '<span class="dish-soldout-badge">Sold Out</span>' : ''}
          </div>
          <div class="dish-card-body">
            <h3 class="dish-card-title">
              <span class="dish-veg-symbol" title="Pure Veg"><span class="dish-veg-symbol-dot"></span></span>
              ${d.name}
              ${isJain ? '<span style="font-size:10px; color:#2E7D32; font-weight:700; margin-left:4px;">[JAIN]</span>' : ''}
            </h3>
            <div class="dish-card-price">${priceStr}</div>
          </div>
        </div>
      `;
    }

    function renderDishes() {
      const container = document.getElementById('dishesGrid');
      const q = (currentSearch || '').toLowerCase().trim();

      const filtered = allDishes.filter(d => {
        const dishCatName = (typeof d.category === 'object' && d.category !== null) ? d.category.name : d.category;
        const matchesCat = currentCategory === 'All' || dishCatName === currentCategory || d.category_id === currentCategory;
        const matchesQ = !q ||
          (d.name && d.name.toLowerCase().includes(q)) ||
          (d.description && d.description.toLowerCase().includes(q));
        return matchesCat && matchesQ;
      });

      document.getElementById('resultsCount').innerHTML = `Showing <strong>${filtered.length}</strong> items`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 48px 20px; color: #6B5545;">
            <h3 style="font-family: var(--font-serif); font-size: 20px; color: var(--color-text-dark); margin-bottom: 8px;">No dishes found</h3>
            <p style="font-size: 14px;">Try searching another keyword or select a different category.</p>
          </div>
        `;
        return;
      }

      if (currentCategory === 'All') {
        const categoryOrder = categories.filter(c => c.id !== 'All').map(c => c.label);

        let html = '';
        categoryOrder.forEach(cat => {
          const catDishes = filtered.filter(d => {
            const cName = (typeof d.category === 'object' && d.category !== null) ? d.category.name : d.category;
            const catId = cat.toLowerCase().replace(/[^a-z0-9]/g, '-');
            return cName === cat || d.category_id === catId || d.category_id === cat;
          });
          if (catDishes.length > 0) {
            html += `
              <section class="category-group-block" aria-label="${cat}">
                <div class="category-group-header">
                  <h2 class="category-group-heading">${cat}</h2>
                  <span class="category-group-badge">${catDishes.length} ${catDishes.length === 1 ? 'item' : 'items'}</span>
                </div>
                <div class="dishes-cards-grid">
                  ${catDishes.map(renderDishCard).join('')}
                </div>
              </section>
            `;
          }
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `
          <section class="category-group-block" aria-label="${currentCategory}">
            <div class="category-group-header">
              <h2 class="category-group-heading">${currentCategory}</h2>
              <span class="category-group-badge">${filtered.length} ${filtered.length === 1 ? 'item' : 'items'}</span>
            </div>
            <div class="dishes-cards-grid">
              ${filtered.map(renderDishCard).join('')}
            </div>
          </section>
        `;
      }
    }

    function openDish(id) {
      const dish = allDishes.find(d => String(d.id) === String(id));
      if (!dish) return;

      activeDishSelectedVariant = null;
      document.getElementById('modalDishTitle').innerText = dish.name;
      document.getElementById('modalDishDesc').innerText = dish.description || '';

      const isSoldOut = dish.is_available === 0 || dish.is_available === false;
      const img0 = (dish.images && dish.images.length > 0 && dish.images[0]) ? dish.images[0] : '/images/dish-placeholder.svg';
      const mainImgEl = document.getElementById('modalMainImg');
      mainImgEl.src = img0;
      mainImgEl.onerror = function () { this.src = '/images/dish-placeholder.svg'; };

      // Handle variants vs single price
      const priceEl = document.getElementById('modalDishPrice');
      let currentPrice = dish.price;

      // If variants exist, render selection buttons
      let variantsContainer = document.getElementById('modalVariantsBox');
      if (!variantsContainer) {
        variantsContainer = document.createElement('div');
        variantsContainer.id = 'modalVariantsBox';
        priceEl.parentNode.insertBefore(variantsContainer, priceEl.nextSibling);
      }

      if (dish.variants && dish.variants.length > 0) {
        activeDishSelectedVariant = dish.variants[0];
        currentPrice = activeDishSelectedVariant.price;
        priceEl.innerText = `₹ ${currentPrice} (${activeDishSelectedVariant.label})`;

        variantsContainer.innerHTML = `
          <div class="dish-variants-row">
            ${dish.variants.map((v, idx) => `
              <button type="button" class="variant-select-btn ${idx === 0 ? 'active' : ''}" onclick="selectVariant('${dish.id}', '${v.id}')">
                ${v.label} - ₹ ${v.price}
              </button>
            `).join('')}
          </div>
        `;
      } else {
        priceEl.innerText = `₹ ${currentPrice}`;
        variantsContainer.innerHTML = '';
      }

      window.currentModalDish = dish;
      window.currentModalPrice = currentPrice;
      window.currentModalIsSoldOut = isSoldOut;

      renderModalActionButtons(dish, currentPrice, isSoldOut);

      const thumbStrip = document.getElementById('modalThumbStrip');
      if (dish.images && dish.images.length > 1) {
        thumbStrip.innerHTML = dish.images.map((img, idx) => `
          <button class="modal-thumb-btn ${idx === 0 ? 'active' : ''}" onclick="selectModalImg(this, '${img}')">
            <img src="${img}" class="modal-thumb-img" alt="">
          </button>
        `).join('');
      } else {
        thumbStrip.innerHTML = '';
      }

      document.getElementById('dishModal').classList.add('open');
    }

    function selectVariant(dishId, variantId) {
      const dish = allDishes.find(d => String(d.id) === String(dishId));
      if (!dish || !dish.variants) return;
      const variant = dish.variants.find(v => String(v.id) === String(variantId));
      if (!variant) return;

      activeDishSelectedVariant = variant;
      window.currentModalPrice = variant.price;
      document.getElementById('modalDishPrice').innerText = `₹ ${variant.price} (${variant.label})`;

      document.querySelectorAll('.variant-select-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(variant.label));
      });

      const isSoldOut = dish.is_available === 0 || dish.is_available === false;
      renderModalActionButtons(dish, variant.price, isSoldOut);
    }

    function renderModalActionButtons(dish, price, isSoldOut) {
      const row = document.getElementById('modalActionsRow');
      if (!row) return;

      const enabledList = (menuActionButtons || []).filter(b => b.is_enabled === 1 || b.is_enabled === true || b.is_enabled === '1');
      if (enabledList.length === 0) {
        row.innerHTML = '';
        row.style.display = 'none';
        return;
      }
      row.style.display = 'flex';

      row.innerHTML = enabledList.map(b => {
        const bg = b.bg_color || '#1F2937';
        const hoverBg = b.hover_color || '#EA580C';
        const iconSvg = getButtonIconSvg(b.type);
        let href = '#';
        let target = '';
        let onclick = '';
        let label = b.label || '';
        let disabledCss = '';
        let idAttr = '';

        if (b.type === 'whatsapp') {
          idAttr = 'id="modalWhatsAppBtn"';
          if (isSoldOut) {
            label = 'Currently Sold Out';
            disabledCss = 'opacity:0.5; pointer-events:none; cursor:not-allowed;';
          } else {
            const vLabel = activeDishSelectedVariant ? ` (${activeDishSelectedVariant.label})` : '';
            const msg = `Hello Amol Veg Resto! I would like to order: ${dish ? dish.name : ''}${vLabel} - ₹${price}`;
            const cleanPhone = (b.phone || '917249664983').replace(/[^0-9]/g, '');
            href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
            target = 'target="_blank" rel="noopener noreferrer"';
          }
        } else if (b.type === 'call_waiter') {
          onclick = `onclick="showToast('🛎️ Waiter notified! A server will visit your table shortly.')"`;
        } else {
          href = b.url || '#';
          target = 'target="_blank" rel="noopener noreferrer"';
        }

        return `
          <a
            href="${href}"
            ${target}
            ${idAttr}
            ${onclick}
            class="uiverse-menu-btn"
            style="--btn-base-bg: ${bg}; --btn-hover-bg: ${hoverBg}; ${disabledCss}"
          >
            <span class="btn-hover-circle"></span>
            <span class="btn-svg-corner-bl">
              <svg xmlns="http://www.w3.org/2000/svg" class="btn-corner-svg" viewBox="0 0 487 487">
                <path fill-opacity=".1" fill-rule="nonzero" fill="#FFF" d="M0 .3c67 2.1 134.1 4.3 186.3 37 52.2 32.7 89.6 95.8 112.8 150.6 23.2 54.8 32.3 101.4 61.2 149.9 28.9 48.4 77.7 98.8 126.4 149.2H0V.3z"></path>
              </svg>
            </span>
            <span class="btn-svg-corner-tr">
              <svg xmlns="http://www.w3.org/2000/svg" class="btn-corner-svg" viewBox="0 0 487 487">
                <path fill-opacity=".1" fill-rule="nonzero" fill="#FFF" d="M487 486.7c-66.1-3.6-132.3-7.3-186.3-37s-95.9-85.3-126.2-137.2c-30.4-51.8-49.3-99.9-76.5-151.4C70.9 109.6 35.6 54.8.3 0H487v486.7z"></path>
              </svg>
            </span>
            <span class="btn-inner-gloss"></span>
            <span class="btn-content-label">
              ${iconSvg}
              <span ${b.type === 'whatsapp' ? 'id="modalWhatsAppText"' : ''}>${label}</span>
            </span>
          </a>
        `;
      }).join('');
    }

    function updateWhatsAppLink(dish, price, isSoldOut) {
      renderModalActionButtons(dish, price, isSoldOut);
    }

    function selectModalImg(btn, src) {
      document.getElementById('modalMainImg').src = src;
      document.querySelectorAll('.modal-thumb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function closeModal() {
      window.currentModalDish = null;
      document.getElementById('dishModal').classList.remove('open');
    }

    function showToast(msg) {
      const t = document.getElementById('toastBanner');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Determine Main vs Special menu mode
    const isSpecial = window.location.pathname.includes('special') || window.location.search.includes('special');
    const menuType = isSpecial ? 'special' : 'main';

    if (isSpecial) {
      document.title = 'Special Menu | Amol Veg Resto';
      let metaRobots = document.querySelector('meta[name="robots"]');
      if (!metaRobots) {
        metaRobots = document.createElement('meta');
        metaRobots.name = 'robots';
        document.head.appendChild(metaRobots);
      }
      metaRobots.content = 'noindex';
    }

    // Load menu data (Live API with graceful fallback to bundled JSON)
    fetch(`/api/public/menu/${menuType}`)
      .then(r => {
        if (!r.ok) throw new Error('API unavailable');
        return r.json();
      })
      .then(data => {
        if (data.categories && Array.isArray(data.categories) && data.categories.length > 0) {
          categories = [
            { id: 'All', label: 'All', icon: getCategoryIcon('All') },
            ...data.categories.map(c => {
              const catName = typeof c === 'string' ? c : (c.name || c.id);
              return {
                id: catName,
                label: catName,
                icon: getCategoryIcon(catName)
              };
            })
          ];
        }

        allDishes = (data.dishes || []).map(d => {
          // Normalize category name for grouping
          if (d.category_id && data.categories) {
            const foundCat = data.categories.find(c => c.id === d.category_id || c.name === d.category_id);
            d.category = foundCat ? (foundCat.name || foundCat.id) : d.category_id;
          }
          return d;
        });

        if (Array.isArray(data.buttons)) {
          menuActionButtons = data.buttons;
          if (window.currentModalDish && document.getElementById('dishModal')?.classList.contains('open')) {
            renderModalActionButtons(window.currentModalDish, window.currentModalPrice, window.currentModalIsSoldOut);
          }
        }

        if (data.menu && data.menu.video_url) {
          const videoEl = document.querySelector('.hero-video-player');
          if (videoEl && videoEl.src !== data.menu.video_url) {
            videoEl.src = data.menu.video_url;
            if (data.menu.poster_url) videoEl.poster = data.menu.poster_url;
          }
        }

        renderCategoryTabs();
        renderDishes();
      })
      .catch(err => {
        console.warn('[Menu] API fallback to local JSON', err);
        fetch('./restaurant_menu_data.json')
          .then(r => r.json())
          .then(data => {
            if (data.categories && Array.isArray(data.categories) && data.categories.length > 0) {
              categories = [
                { id: 'All', label: 'All', icon: getCategoryIcon('All') },
                ...data.categories.map(c => {
                  const catName = typeof c === 'string' ? c : (c.name || c.id);
                  return {
                    id: catName,
                    label: catName,
                    icon: getCategoryIcon(catName)
                  };
                })
              ];
            }

            if (Array.isArray(data.buttons)) {
              menuActionButtons = data.buttons;
              if (window.currentModalDish && document.getElementById('dishModal')?.classList.contains('open')) {
                renderModalActionButtons(window.currentModalDish, window.currentModalPrice, window.currentModalIsSoldOut);
              }
            }

            allDishes = (data.dishes || []).map(d => {
              if (isSpecial) {
                d.price = d.special_price || Math.round(d.price * 1.10);
              }
              return d;
            });
            renderCategoryTabs();
            renderDishes();
          });
      });
  </script>
</body>
